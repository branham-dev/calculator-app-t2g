<!DOCTYPE html>
<html lang="en" class="theme-dar">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calculator App</title>
		<link rel="stylesheet" href="css/main.css" />
	</head>
	<body>
		<header class="header">
			<div class="header__container">
				<h1 class="header__title">Calc</h1>
				<div class="header__theme switch">
					<p class="switch__text">Theme</p>
					<div class="switch__container" id="switch-container">
						<label for="theme-dark" class="switch__label">
							<span>1</span>
							<input type="radio" name="theme" id="theme-dark" />
						</label>
						<label for="theme-light" class="switch__label"
							><span>2</span>
							<input type="radio" name="theme" id="theme-light" class="switch__label" />
						</label>
						<label for="theme-contrast" class="switch__label"
							><span>3</span>
							<input type="radio" name="theme" id="theme-contrast" class="switch__label" />
						</label>
					</div>
				</div>
			</div>
		</header>
		<main class="calculator">
			<form action="" id="calculator-form">
				<div class="calculator__container">
					<input type="text" id="calculator-input" class="calculator__input" /readonly>

					<div class="calculator__board" id="calculator-board"></div>
				</div>
			</form>
		</main>
		<script src="./js/index.js" type="module"></script>
	</body>
</html>
