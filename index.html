<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calculator App</title>
		<link rel="stylesheet" href="css/main.css" />
	</head>
	<body>
		<header class="header">
			<div class="header__container">
				<h1 class="header__title">Calc</h1>
				<div class="header__theme">Theme</div>
			</div>
		</header>
		<main class="calculator">
			<form action="">
				<div class="calculator__container">
					<input type="text" class="calculator__input" />

					<div class="calculator__board">
						<button class="calculator__button calculator__button--pri">7</button>
						<button class="calculator__button calculator__button--pri">8</button>
						<button class="calculator__button calculator__button--pri">9</button>
						<button class="calculator__button calculator__button--func">DEL</button>
						<button class="calculator__button calculator__button--pri">4</button>
						<button class="calculator__button calculator__button--pri">5</button>
						<button class="calculator__button calculator__button--pri">6</button>
						<button class="calculator__button calculator__button--pri">+</button>
						<button class="calculator__button calculator__button--pri">1</button>
						<button class="calculator__button calculator__button--pri">2</button>
						<button class="calculator__button calculator__button--pri">3</button>
						<button class="calculator__button calculator__button--pri">-</button>
						<button class="calculator__button calculator__button--pri">.</button>
						<button class="calculator__button calculator__button--pri">0</button>
						<button class="calculator__button calculator__button--pri">/</button>
						<button class="calculator__button calculator__button--pri">x</button>
						<button class="calculator__button calculator__button--func">RESET</button>
						<button class="calculator__button calculator__button--acc">=</button>
					</div>
				</div>
			</form>
		</main>
	</body>
</html>
